<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#000000"/>
<meta name="color-scheme" content="dark"/>
<meta name="description" content="A free trading journal by Orochi Trading. Your trades stay on your device."/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black"/>
<meta name="apple-mobile-web-app-title" content="Orochi"/>
<title>Orochi Journal</title>
<link rel="manifest" href="manifest.webmanifest"/>
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ═══════════ OROCHI JOURNAL v2 — base system ═══════════ */
:root{
  --fg:#fff; --g90:rgba(255,255,255,.9); --g80:rgba(255,255,255,.8); --g70:rgba(255,255,255,.7); --g55:rgba(255,255,255,.55);
  --g40:rgba(255,255,255,.4); --g28:rgba(255,255,255,.28); --g18:rgba(255,255,255,.18); --g12:rgba(255,255,255,.12);
  --g08:rgba(255,255,255,.08); --g05:rgba(255,255,255,.05); --g03:rgba(255,255,255,.03);
  --line:rgba(255,255,255,.1); --line2:rgba(255,255,255,.2);
  --pos:#fff; --neg:rgba(255,255,255,.5); --neg-fill:rgba(255,255,255,.6);
  --panel:rgba(9,9,9,.72);
  --back:cubic-bezier(.34,1.56,.64,1); --out:cubic-bezier(.16,1,.3,1); --io:cubic-bezier(.65,0,.35,1);
  --font:'Inter','Segoe UI Variable Display','Segoe UI',system-ui,-apple-system,sans-serif;
  --r:18px;
}
[data-color="on"]{ --pos:#6ee7a0; --neg:#ff7a7a; --neg-fill:#ff7a7a; }
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;color:var(--g80);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow:hidden}
#root{position:relative;z-index:1;height:100%}
#stage{position:fixed;inset:0;z-index:0;pointer-events:none}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:disabled{cursor:default}
p{margin:0} img{display:block;max-width:100%}
::selection{background:#fff;color:#000}
:focus{outline:none}
:focus-visible{outline:1px solid rgba(255,255,255,.75);outline-offset:3px;border-radius:6px}
*{scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.16) transparent}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:8px;border:2px solid transparent;background-clip:padding-box}::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.3);background-clip:padding-box;border:2px solid transparent}::-webkit-scrollbar-track{background:transparent}
.tnum{font-variant-numeric:tabular-nums;font-feature-settings:'tnum' 1,'cv11' 1}
.grow{flex:1} .dim{opacity:.45}
.ic{flex-shrink:0;display:block}
.link{color:var(--g70);font-size:12px;letter-spacing:.04em;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--g28);transition:color .2s}.link:hover{color:#fff}

/* ── motion ── */
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.985)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pulse{0%{transform:scale(.5);opacity:.9}100%{transform:scale(2.4);opacity:0}}
@keyframes glowpulse{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes growY{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes growX{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes tracking{from{letter-spacing:.7em;opacity:0}to{opacity:1}}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(2px)}}
.rise{animation:rise .75s var(--out) backwards;animation-delay:calc(var(--i,0)*60ms + var(--d,0ms))}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.7s var(--io) .2s forwards}
.no-motion *,.no-motion *::before,.no-motion *::after{animation-duration:.001s!important;animation-delay:0s!important;transition-duration:.001s!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001s!important;animation-delay:0s!important;transition-duration:.001s!important}}

/* ── type ── */
.lbl{font-size:10.5px;font-weight:600;letter-spacing:.28em;text-transform:uppercase;color:var(--g55);line-height:1.4}
.kbd{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:20px;padding:0 6px;border:1px solid var(--line2);border-radius:6px;font:600 10px/1 var(--font);letter-spacing:.08em;color:var(--g55);text-transform:uppercase;background:var(--g03)}

/* ── panel ── */
.panel{position:relative;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);transition:border-color .35s,box-shadow .35s}
.panel.hot:hover{border-color:var(--line2)}
.panel-h{display:flex;align-items:center;gap:12px;padding:18px 22px 0}
.panel-b{padding:18px 22px 22px}

/* ── buttons ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 16px;border:1px solid var(--line2);border-radius:999px;font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--g80);white-space:nowrap;transition:background .2s,color .2s,border-color .2s,box-shadow .3s,transform .15s var(--out)}
.btn:hover:not(:disabled){border-color:#fff;color:#fff;background:var(--g05)}
.btn:active:not(:disabled){transform:scale(.96)}
.btn:disabled{opacity:.3}
.btn.solid{background:#fff;color:#000;border-color:#fff;box-shadow:0 0 0 rgba(255,255,255,0)}
.btn.solid:hover:not(:disabled){background:#fff;color:#000;box-shadow:0 0 30px rgba(255,255,255,.4)}
.btn.ghost{border-color:transparent;color:var(--g55)}.btn.ghost:hover:not(:disabled){background:var(--g05);border-color:transparent}
.btn.danger{border-color:var(--line2);color:var(--g80)}.btn.danger:hover:not(:disabled){background:#fff;color:#000;border-color:#fff}
.btn.sm{height:30px;padding:0 12px;font-size:10px}
.btn.lg{height:44px;padding:0 24px;font-size:12px}
.ibtn{position:relative;display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:10px;color:var(--g55);transition:color .2s,background .2s,transform .15s}
.ibtn:hover:not(:disabled){color:#fff;background:var(--g08)}.ibtn:active:not(:disabled){transform:scale(.92)}.ibtn:disabled{opacity:.25}
.ibtn.on{color:#fff}
.mini{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border:1px solid var(--line);border-radius:8px;font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--g55);transition:all .2s}
.mini:hover{color:#fff;border-color:var(--line2);background:var(--g05)}
[data-tip]:hover::after{content:attr(data-tip);position:absolute;top:calc(100% + 8px);left:50%;transform:translateX(-50%);padding:5px 9px;border-radius:7px;background:#fff;color:#000;font:600 10px/1.2 var(--font);letter-spacing:.08em;white-space:nowrap;z-index:300;pointer-events:none;animation:fade .15s .35s both}
.chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 14px;border:1px solid var(--line);border-radius:999px;font-size:12px;font-weight:500;color:var(--g55);white-space:nowrap;transition:all .22s var(--out)}
.chip:hover{color:#fff;border-color:var(--line2)}
.chip.on{background:#fff;color:#000;border-color:#fff;font-weight:600;box-shadow:0 0 22px rgba(255,255,255,.22)}
.chip.sm{height:26px;padding:0 10px;font-size:11px}
.seg{position:relative;display:inline-flex;padding:3px;border:1px solid var(--line);border-radius:999px;background:var(--g03)}
.seg-thumb{position:absolute;top:3px;bottom:3px;left:0;border-radius:999px;background:#fff;box-shadow:0 0 20px rgba(255,255,255,.25);transition:transform .45s var(--out),width .45s var(--out)}
.seg-b{position:relative;z-index:1;height:28px;padding:0 14px;border-radius:999px;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--g55);transition:color .25s;white-space:nowrap}
.seg-b:hover{color:#fff}.seg-b.on{color:#000}
.seg.sm .seg-b{height:24px;padding:0 10px;font-size:10px}

/* ── tags ── */
.pnl{font-weight:600;white-space:nowrap}.pnl.pos{color:var(--pos)}.pnl.neg{color:var(--neg)}.pnl.flat,.pnl.nil{color:var(--g40)}
.dir{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border:1px solid var(--line2);border-radius:6px;font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--g90)}
.dir.short{color:var(--g55);border-style:dashed}
.dir.sm{height:19px;padding:0 6px;font-size:9px}
.state{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;border-radius:999px;font-size:9.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;border:1px solid var(--line2);color:var(--g70);white-space:nowrap}
.state::before{content:'';width:5px;height:5px;border-radius:50%;background:currentColor}
.state.s-reviewed{background:#fff;color:#000;border-color:#fff}
.state.s-needs-review{color:#fff;border-color:#fff}.state.s-needs-review::before{animation:glowpulse 1.6s ease-in-out infinite;box-shadow:0 0 8px #fff}
.state.s-open{color:var(--g55)}.state.s-open::before{background:transparent;border:1px solid currentColor}
.state.s-draft{color:var(--g40);border-style:dashed}
.grade{display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:22px;padding:0 7px;border-radius:6px;font-size:11px;font-weight:800;letter-spacing:.04em;border:1px solid var(--line2);color:var(--g70)}
.grade.g-ap,.grade.g-a{background:#fff;color:#000;border-color:#fff}
.grade.g-bp,.grade.g-b{color:#fff;border-color:var(--g55)}
.grade.g-c{color:var(--g40);border-style:dashed}

/* ── fields ── */
.field{display:flex;flex-direction:column;gap:9px;min-width:0}
.field-l{display:flex;align-items:baseline;gap:8px;font-size:10.5px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--g55)}
.field-l .req{color:#fff}.field-h{font-size:10.5px;letter-spacing:.02em;text-transform:none;font-weight:400;color:var(--g40)}
.inp{width:100%;height:44px;padding:0 14px;background:var(--g03);border:1px solid var(--line);border-radius:12px;color:#fff;font-size:14px;transition:border-color .25s,box-shadow .25s,background .25s;color-scheme:dark}
.inp::placeholder,textarea::placeholder{color:var(--g28)}
.inp:hover{border-color:var(--line2)}
.inp:focus{border-color:#fff;background:var(--g05);box-shadow:0 0 0 4px rgba(255,255,255,.06),0 0 26px rgba(255,255,255,.09)}
textarea.inp{height:auto;padding:12px 14px;resize:vertical;line-height:1.65;min-height:84px}
.field-btn{display:flex;align-items:center;gap:10px;width:100%;height:44px;padding:0 14px;background:var(--g03);border:1px solid var(--line);border-radius:12px;color:#fff;font-size:14px;text-align:left;transition:border-color .25s,box-shadow .25s,background .25s}
.field-btn>span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.field-btn:hover{border-color:var(--line2);background:var(--g05)}
.field-btn.ph>span{color:var(--g28)}
.field-btn.big{height:64px;padding:0 20px;font-size:26px;font-weight:700;letter-spacing:-.01em;border-radius:16px}
.field-x{display:flex;padding:4px;border-radius:6px;color:var(--g40)}.field-x:hover{color:#fff;background:var(--g08)}
.time-f{display:flex;gap:8px}.time-f .inp{flex:1;min-width:0}.time-f .mini{height:44px;border-radius:12px;padding:0 14px}
.num-f{position:relative;display:flex;align-items:center}
.num-f .num-p{position:absolute;left:14px;color:var(--g40);font-weight:600;pointer-events:none}
.num-f .num-p+.inp{padding-left:30px}
.num-f.big .inp{height:64px;font-size:26px;font-weight:700;border-radius:16px;padding-left:20px}
.num-f.big .num-p{left:20px;font-size:22px}.num-f.big .num-p+.inp{padding-left:44px}

/* ── popover + calendar ── */
.pop{position:fixed;z-index:160;padding:14px;border:1px solid var(--line2);border-radius:16px;background:rgba(6,6,6,.97);box-shadow:0 24px 70px rgba(0,0,0,.8),0 0 0 1px rgba(255,255,255,.03),0 0 40px rgba(255,255,255,.05);animation:pop .28s var(--back) backwards;transform-origin:top center}
.cal-h{display:flex;align-items:center;gap:6px;margin-bottom:10px}.cal-m{flex:1;text-align:center;font-size:12px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:#fff}
.cal-g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.cal-w{height:24px;display:flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:600;letter-spacing:.1em;color:var(--g28)}
.cal-d{position:relative;height:32px;border-radius:9px;font-size:12.5px;color:var(--g70);font-variant-numeric:tabular-nums;transition:background .15s,color .15s}
.cal-d:hover{background:var(--g12);color:#fff}
.cal-d.today{box-shadow:inset 0 0 0 1px var(--g40);color:#fff}
.cal-d.on{background:#fff;color:#000;font-weight:700;box-shadow:0 0 18px rgba(255,255,255,.35)}
.cal-d.mark::after{content:'';position:absolute;left:50%;bottom:4px;width:3px;height:3px;margin-left:-1.5px;border-radius:50%;background:currentColor;opacity:.7}
.cal-f{display:flex;justify-content:center;margin-top:10px}

/* ── overlays ── */
.ov{position:fixed;inset:0;z-index:120;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(0,0,0,.78);backdrop-filter:blur(10px);animation:fade .22s ease both}
.ov.out{opacity:0;transition:opacity .2s ease}
.modal{position:relative;width:min(520px,100%);max-height:calc(100vh - 48px);display:flex;flex-direction:column;border:1px solid var(--line2);border-radius:22px;background:#050505;box-shadow:0 40px 120px rgba(0,0,0,.9),0 0 80px rgba(255,255,255,.045);animation:pop .4s var(--back) backwards;overflow:hidden}
.ov.out .modal{transform:scale(.97);transition:transform .2s ease}
.modal.wide{width:min(980px,100%)}
.dlg{padding:28px;gap:0;width:min(440px,100%)}
.dlg-t{font-size:20px;font-weight:700;color:#fff;letter-spacing:-.01em}
.dlg-b{margin-top:10px;color:var(--g55);font-size:14px;line-height:1.6}
.dlg-i{margin-top:18px}
.dlg-a{display:flex;justify-content:flex-end;flex-wrap:wrap;gap:10px;margin-top:26px}
.toasts{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:400;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{pointer-events:auto;display:flex;align-items:center;gap:12px;min-height:44px;padding:8px 10px 8px 18px;border:1px solid var(--line2);border-radius:999px;background:rgba(8,8,8,.96);box-shadow:0 18px 50px rgba(0,0,0,.7),0 0 30px rgba(255,255,255,.06);font-size:13px;color:#fff;animation:rise .5s var(--back) backwards}
.toast-m{padding-right:8px}
.toast-dot{width:6px;height:6px;border-radius:50%;background:#fff;box-shadow:0 0 10px #fff}
.toast.warn .toast-dot{background:transparent;border:1.5px solid #fff;box-shadow:none}
.toast-a{height:28px;padding:0 14px;border-radius:999px;background:#fff;color:#000;font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase}
.lightbox{position:fixed;inset:0;z-index:300;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.96);animation:fade .2s ease both;cursor:zoom-out}
.lightbox img{max-width:96vw;max-height:calc(100vh - 110px);object-fit:contain;border-radius:8px;animation:pop .35s var(--out) backwards;cursor:default;box-shadow:0 0 0 1px var(--line)}
.lb-load{color:var(--g40);letter-spacing:.2em;text-transform:uppercase;font-size:11px}
.lb-bar{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line2);border-radius:999px;background:rgba(8,8,8,.9);cursor:default}
.lb-n{font-size:12px;color:var(--g70);padding:0 4px}

/* ── instrument picker ── */
.modal.inst{width:min(560px,100%);height:min(640px,calc(100vh - 48px))}
.inst-s{display:flex;align-items:center;gap:12px;padding:18px 20px;border-bottom:1px solid var(--line);color:var(--g40)}
.inst-s input{flex:1;background:none;border:0;font-size:18px;font-weight:600;color:#fff;min-width:0}
.inst-l{flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:18px}
.inst-g{display:flex;flex-direction:column;gap:10px}
.inst-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}
.inst-i{display:flex;align-items:center;justify-content:space-between;gap:6px;height:40px;padding:0 12px;border:1px solid var(--line);border-radius:11px;font-size:13px;font-weight:600;color:var(--g70);cursor:pointer;transition:all .18s var(--out)}
.inst-i.cur{border-color:#fff;color:#fff;background:var(--g05);box-shadow:0 0 22px rgba(255,255,255,.1)}
.inst-i.sel{background:#fff;color:#000;border-color:#fff}
.inst-x{display:flex;padding:3px;border-radius:5px;opacity:.5}.inst-x:hover{opacity:1;background:var(--g18)}
.inst-none{color:var(--g40);font-size:13px;padding:6px 0}
.inst-c{display:flex;gap:8px;padding:14px 20px;border-top:1px solid var(--line)}.inst-c .inp{flex:1;height:36px;border-radius:999px;font-size:13px}

/* ── rich text ── */
.rt{border:1px solid var(--line);border-radius:14px;background:var(--g03);transition:border-color .25s,box-shadow .25s}
.rt:hover{border-color:var(--line2)}
.rt:focus-within{border-color:#fff;box-shadow:0 0 0 4px rgba(255,255,255,.06),0 0 26px rgba(255,255,255,.08)}
.rt-bar{display:flex;align-items:center;gap:2px;padding:6px 8px;border-bottom:1px solid var(--line)}
.rt-bar .ibtn{width:28px;height:28px;border-radius:8px}
.rt-body{position:relative}
.rt-hl,.rt-ta{margin:0;padding:14px 16px;font:400 14.5px/24px var(--font);letter-spacing:0;white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere;tab-size:2;border:0;width:100%}
.rt-hl{position:absolute;inset:0;overflow:hidden;color:var(--g80);pointer-events:none}
.rt-ta{position:relative;display:block;background:transparent;color:transparent;caret-color:#fff;resize:none;overflow:hidden;min-height:120px}
.rt-ta::placeholder{color:var(--g28)}
.rt-ta::selection{background:rgba(255,255,255,.28);color:transparent}
.rt-m{color:var(--g28)}.rt-h{color:#fff;text-shadow:0 0 14px rgba(255,255,255,.55)}.rt-b{color:#fff}
.tpl-pop{display:flex;flex-direction:column;gap:6px;padding:12px}.tpl-pop .lbl{padding:4px 6px 6px}
.tpl-i{position:relative;padding:10px 34px 10px 12px;border:1px solid var(--line);border-radius:11px;cursor:pointer;transition:all .18s}.tpl-i:hover{border-color:#fff;background:var(--g05)}
.tpl-i .inst-x{position:absolute;right:8px;top:10px}
.tpl-n{font-size:13px;font-weight:600;color:#fff}.tpl-p{font-size:11.5px;color:var(--g40);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tpl-save{display:flex;align-items:center;gap:8px;padding:10px 12px;border:1px dashed var(--line2);border-radius:11px;font-size:12px;color:var(--g55);transition:all .18s}.tpl-save:hover:not(:disabled){color:#fff;border-color:#fff}.tpl-save:disabled{opacity:.35}
.rv{font-size:14.5px;line-height:1.72;color:var(--g80)}
.rv strong{color:#fff;font-weight:650}.rv em{font-style:italic}.rv u{text-underline-offset:3px}
.rv-h1{font-size:19px;font-weight:700;color:#fff;margin:14px 0 6px;letter-spacing:-.01em}
.rv-h2,.rv-h3{font-size:10.5px;font-weight:700;letter-spacing:.26em;text-transform:uppercase;color:#fff;margin:18px 0 6px}
.rv-h3{color:var(--g55)}
.rv>:first-child{margin-top:0}
.rv-sp{height:10px}
.rv-li{position:relative;padding-left:18px}.rv-li::before{content:'';position:absolute;left:3px;top:.72em;width:7px;height:1px;background:var(--g55)}

/* ── images ── */
.thumb,.fullimg{position:relative;overflow:hidden;background:var(--g03)}
.thumb img,.fullimg img{width:100%;height:100%;object-fit:cover;animation:fade .4s ease both}
.thumb.loading::after,.fullimg.loading::after{content:'';position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.05) 50%,transparent 70%);background-size:200% 100%;animation:shimmer 1.4s linear infinite}
@keyframes shimmer{from{background-position:200% 0}to{background-position:-200% 0}}
.imgdrop{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.imgdrop.none{display:block}
.imgdrop-i{position:relative;aspect-ratio:16/10;border-radius:12px;overflow:hidden;border:1px solid var(--line);transition:border-color .2s,transform .3s var(--out)}
.imgdrop-i:hover{border-color:#fff;transform:translateY(-2px)}
.imgdrop-i .thumb{width:100%;height:100%;cursor:zoom-in}
.imgdrop-x{position:absolute;top:6px;right:6px;display:flex;padding:5px;border-radius:7px;background:rgba(0,0,0,.75);border:1px solid var(--line2);color:#fff;opacity:0;transition:opacity .2s}
.imgdrop-i:hover .imgdrop-x,.imgdrop-x:focus-visible{opacity:1}
.imgdrop-add{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;width:100%;min-height:96px;aspect-ratio:16/10;border:1px dashed var(--line2);border-radius:12px;color:var(--g40);transition:all .25s var(--out)}
.imgdrop.none .imgdrop-add{aspect-ratio:auto;min-height:132px;border-radius:16px}
.imgdrop-add:hover,.imgdrop.drag .imgdrop-add{border-color:#fff;color:#fff;background:var(--g05);box-shadow:0 0 30px rgba(255,255,255,.07)}
.imgdrop-t{font-size:12.5px;font-weight:500}.imgdrop-s{font-size:11px;color:var(--g28)}

/* ── ring ── */
.ring{position:relative;flex-shrink:0}.ring svg{display:block}
.ring-bg{stroke:var(--g12)}.ring-fg{stroke:#fff;filter:drop-shadow(0 0 6px rgba(255,255,255,.55));transition:stroke-dashoffset 1.5s var(--out)}
.ring-in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}

/* ── charts ── */
.chart{position:relative;width:100%;user-select:none}
.ch-svg{display:block;overflow:visible}
.ch-grid{stroke:var(--g08);stroke-width:1}.ch-zero{stroke:var(--g40);stroke-width:1;stroke-dasharray:5 6;fill:none}
.ch-tick{fill:var(--g40);font:500 10px var(--font);letter-spacing:.06em;font-variant-numeric:tabular-nums}
.ch-line{fill:none;stroke:#fff;stroke-width:2;stroke-linejoin:round;stroke-linecap:round;filter:drop-shadow(0 0 7px rgba(255,255,255,.6))}
.ch-area{animation:fade 1.6s ease .6s both}
.ch-dot{fill:#fff;filter:drop-shadow(0 0 8px #fff)}
.ch-tip{animation:fade .5s ease 1.7s both}
.ch-pulse{fill:none;stroke:#fff;stroke-width:1.2;transform-box:fill-box;transform-origin:center;animation:pulse 2.2s var(--out) infinite}
.ch-cross{stroke:var(--g40);stroke-width:1;stroke-dasharray:3 4}
.ch-tt{position:absolute;z-index:5;transform:translateX(-50%);padding:8px 12px;border-radius:10px;background:#fff;color:#000;text-align:center;pointer-events:none;white-space:nowrap;box-shadow:0 0 30px rgba(255,255,255,.25)}
.ch-tt-v{font-size:14px;font-weight:700}.ch-tt-s{font-size:10px;font-weight:600;letter-spacing:.08em;opacity:.6;text-transform:uppercase}
.chart-empty{display:flex;align-items:center;justify-content:center}
.chart-empty svg{position:absolute;inset:0}
.chart-empty-t{position:relative;padding:8px 16px;border:1px solid var(--line);border-radius:999px;background:#000;font-size:10.5px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--g40)}
.candles .cd{cursor:pointer;transition:opacity .25s;animation:growY .7s var(--back) both;animation-delay:calc(var(--i)*22ms + 150ms)}
.cd-wick{stroke:var(--g55);stroke-width:1.2}
.cd.up .cd-body{fill:#000;stroke:var(--pos);stroke-width:1.6}
.cd.dn .cd-body{fill:var(--neg-fill);stroke:var(--neg-fill);stroke-width:1.6}
.cd.dim{opacity:.3}.cd.hov .cd-body{filter:drop-shadow(0 0 7px #fff)}
.rows{display:flex;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:minmax(88px,140px) 1fr auto;align-items:center;gap:14px;padding:11px 14px;border:1px solid var(--line);border-radius:12px;transition:border-color .2s,background .2s}
.row:hover{border-color:var(--line2);background:var(--g03)}
.row-l{font-size:12.5px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-track{height:8px;border-radius:5px;background:var(--g05);overflow:hidden}
.row-bar{height:100%;width:var(--w);border-radius:5px;background:#fff;transform-origin:left;animation:growX .9s var(--out) both;animation-delay:calc(var(--i,0)*60ms + 250ms);box-shadow:0 0 12px rgba(255,255,255,.4)}
.rows.signed .row.neg .row-bar{background:repeating-linear-gradient(135deg,var(--neg-fill) 0 2px,transparent 2px 5px);box-shadow:none}
.rows.signed .row.pos .row-bar{background:var(--pos)}
.row-r{font-size:13px;font-weight:600;color:#fff;min-width:74px;text-align:right}.row.neg .row-r{color:var(--neg)}
.row-s{grid-column:1/-1;font-size:11px;color:var(--g40);margin-top:-4px}
.row.best{border-color:var(--g55)}
.cols{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:10px}
.col{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0}
.col-v{font-size:13px;font-weight:700;color:#fff}.col.nil .col-v{color:var(--g28)}
.col-track{flex:1;width:100%;max-width:44px;display:flex;align-items:flex-end;border-radius:8px;background:var(--g03);border:1px solid var(--line);overflow:hidden}
.col-bar{width:100%;height:var(--h);background:#fff;transform-origin:bottom;animation:growY .9s var(--back) both;animation-delay:calc(var(--i)*70ms + 200ms);box-shadow:0 0 16px rgba(255,255,255,.35)}
.col-l{font-size:10px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--g55)}
.col-s{font-size:10px;color:var(--g28);height:12px}

/* ── empty ── */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:48px 24px;text-align:center}
.empty-ic{display:flex;align-items:center;justify-content:center;width:64px;height:64px;border:1px dashed var(--line2);border-radius:50%;color:var(--g40);margin-bottom:8px}
.empty-t{font-size:11px;font-weight:600;letter-spacing:.26em;text-transform:uppercase;color:var(--g70)}
.empty-s{font-size:13px;color:var(--g40);max-width:340px}
.empty .btn{margin-top:14px}
input:focus-visible,textarea:focus-visible{outline:none}
/* ═══════════ shell ═══════════ */
.app{display:grid;grid-template-columns:72px minmax(0,1fr);height:100vh}
.rail{position:relative;display:flex;flex-direction:column;align-items:center;padding:14px 0 18px;border-right:1px solid var(--line);background:rgba(0,0,0,.5);z-index:40}
.rail-mark{display:flex;align-items:center;justify-content:center;width:44px;height:50px;margin-bottom:20px;border-radius:12px;transition:filter .35s,transform .35s var(--out)}
.rail-mark img{width:46px;height:auto;mix-blend-mode:screen}
.rail-mark:hover{filter:drop-shadow(0 0 12px rgba(255,255,255,.75));transform:scale(1.06)}
.rail-g{display:flex;flex-direction:column;gap:6px}
.rail-i{position:relative;display:flex;align-items:center;justify-content:center;width:46px;height:46px;border-radius:14px;color:var(--g40);transition:color .25s,background .25s,transform .2s var(--out)}
.rail-i:hover{color:#fff;background:var(--g05)}.rail-i:active{transform:scale(.92)}
.rail-i.on{color:#fff}.rail-i.on .ic{filter:drop-shadow(0 0 7px rgba(255,255,255,.8))}
.rail-ind{position:absolute;left:0;top:-14px;width:3px;height:28px;border-radius:0 3px 3px 0;background:#fff;box-shadow:0 0 16px 2px rgba(255,255,255,.7);transition:transform .6s var(--back);pointer-events:none}
.rail-tip{position:absolute;left:calc(100% + 14px);top:50%;transform:translateY(-50%) translateX(-6px);display:flex;align-items:center;gap:10px;height:32px;padding:0 8px 0 12px;border-radius:9px;background:#fff;color:#000;font-size:10px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .18s,transform .3s var(--out);z-index:60}
.rail-tip .kbd{border-color:rgba(0,0,0,.25);color:rgba(0,0,0,.6);background:transparent}
.rail-i:hover .rail-tip,.rail-i:focus-visible .rail-tip{opacity:1;transform:translateY(-50%)}
.main{display:flex;flex-direction:column;min-width:0;height:100vh}
.hud{display:flex;align-items:center;gap:14px;height:68px;padding:0 28px;flex-shrink:0}
.hud-l{display:flex;align-items:center;gap:14px;min-width:0}
.hud-ix{font-size:11px;font-weight:600;letter-spacing:.2em;color:var(--g40)}
.hud-bar{width:28px;height:1px;background:var(--g28)}
.hud-title{font-size:12px;font-weight:700;letter-spacing:.34em;text-transform:uppercase;color:#fff;white-space:nowrap;animation:tracking .8s var(--out) backwards}
.hud-search{display:flex;align-items:center;gap:10px;height:36px;padding:0 8px 0 14px;border:1px solid var(--line);border-radius:999px;color:var(--g40);font-size:12px;transition:all .2s}
.hud-search span{letter-spacing:.06em;margin-right:16px}
.hud-search:hover{color:#fff;border-color:var(--line2);background:var(--g03)}
.clock{display:flex;align-items:baseline;gap:5px;padding-left:16px;margin-left:2px;border-left:1px solid var(--line)}
.clock-t{font-size:15px;font-weight:700;color:#fff;letter-spacing:.04em}.clock-s{font-size:11px;font-weight:600;color:var(--g40);width:16px}
.loopdots{position:relative;display:flex;align-items:center;gap:6px;height:36px;padding:0 10px;border-radius:999px}
.loopdots:hover{background:var(--g05)}
.ld{width:7px;height:7px;border-radius:50%;border:1px solid var(--g40);transition:all .4s}
.ld.done{background:#fff;border-color:#fff;box-shadow:0 0 9px rgba(255,255,255,.8)}.ld.part{background:var(--g40)}
.view-wrap{position:relative;flex:1;min-height:0}
.view{position:absolute;inset:0}
.dip{position:absolute;inset:0;z-index:30;background:#000;opacity:0;pointer-events:none;transition:opacity .26s ease}
.dip.on{opacity:1;transition-duration:.14s}
.page{height:100%;overflow-y:auto;overflow-x:hidden;scrollbar-gutter:stable}
.page-in{max-width:1480px;margin:0 auto;padding:8px 28px 72px;display:flex;flex-direction:column;gap:18px}
.page-head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;padding-top:6px}
.page-title{margin:8px 0 0;font-size:34px;font-weight:700;letter-spacing:-.025em;line-height:1.1;color:#fff}
.page-sub{margin-top:6px;font-size:13.5px;color:var(--g40)}

/* ── boot ── */
.boot{position:fixed;inset:0;z-index:600;display:flex;align-items:center;justify-content:center;background:#000;cursor:pointer;transition:opacity .85s ease,visibility 0s .85s}
.boot.out{opacity:0;visibility:hidden;pointer-events:none}
.boot-in{display:flex;flex-direction:column;align-items:center;gap:22px;transition:transform 1s var(--io),filter 1s}
.boot.out .boot-in{transform:scale(1.1);filter:blur(8px)}
.boot-logo{width:min(560px,70vw);mix-blend-mode:screen;animation:bootlogo 1.7s var(--out) backwards}
@keyframes bootlogo{0%{opacity:0;transform:scale(.93);filter:blur(12px) brightness(.4)}55%{opacity:1;filter:blur(0) brightness(1.55)}100%{opacity:1;transform:none;filter:brightness(1)}}
.boot-line{width:min(420px,56vw);height:1px;background:linear-gradient(90deg,transparent,#fff,transparent);box-shadow:0 0 14px rgba(255,255,255,.85);transform:scaleX(0);animation:growX 1.2s var(--io) .45s forwards}
.boot-tag{font-size:11px;font-weight:600;letter-spacing:.5em;text-transform:uppercase;color:var(--g70);padding-left:.5em;animation:tracking 1.3s var(--out) .85s backwards}
.boot-prog{height:14px;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--g40)}

/* ── palette / help / welcome ── */
.modal.pal{width:min(620px,100%);align-self:flex-start;margin-top:11vh;max-height:min(560px,calc(100vh - 22vh))}
.pal-l{overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:2px}
.pal-i{display:flex;align-items:center;gap:12px;min-height:44px;padding:6px 12px;border-radius:12px;text-align:left;color:var(--g70);transition:background .12s}
.pal-i.cur{background:var(--g08);color:#fff}
.pal-ic{display:flex;align-items:center;justify-content:center;width:30px;height:30px;border:1px solid var(--line);border-radius:9px;color:var(--g55);flex-shrink:0}
.pal-i.cur .pal-ic{border-color:#fff;color:#fff}
.pal-t{font-size:14px;font-weight:600;white-space:nowrap}.pal-d{font-size:11.5px;color:var(--g40);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pal-none{padding:22px 14px}
.help-l{margin-top:14px}
.dlg.welcome{width:min(520px,100%);padding:32px}
.dlg-t.big{font-size:28px;letter-spacing:-.02em;margin-top:10px;line-height:1.15}
.dlg-b.sm{font-size:12px;color:var(--g40)}
.wel-stats{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.wel-s{flex:1;min-width:84px;padding:14px 12px;border:1px solid var(--line);border-radius:14px;text-align:center}
.wel-v{font-size:26px;font-weight:800;color:#fff;letter-spacing:-.02em;line-height:1.1;margin-bottom:6px}
.wel-s .lbl{font-size:8.5px;letter-spacing:.2em}
.wel-f{margin-top:22px}
.wel-tips{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:18px}
.wel-tip{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--g55)}

/* ═══════════ dashboard ═══════════ */
.dash-top{display:flex;align-items:flex-end;gap:20px;flex-wrap:wrap;padding-top:6px}
.dash-greet{margin:8px 0 0;font-size:34px;font-weight:700;letter-spacing:-.025em;line-height:1.1;color:#fff}
.loop{padding:16px 22px 18px}
.loop-h{display:flex;align-items:center;gap:10px;margin-bottom:14px}.loop-c{font-size:11px;font-weight:600;color:var(--g40)}
.loop-track{position:relative;display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.loop-line,.loop-fill{position:absolute;left:12.5%;right:12.5%;top:12px;height:1px}
.loop-line{background:repeating-linear-gradient(90deg,var(--g28) 0 6px,transparent 6px 12px)}
.loop-fill{background:#fff;transform-origin:left;transform:scaleX(var(--p));transition:transform 1.3s var(--out) .3s;box-shadow:0 0 10px rgba(255,255,255,.8)}
.loop-n{position:relative;display:flex;flex-direction:column;align-items:center;gap:5px;padding:0 6px 2px;border-radius:12px;text-align:center}
.loop-dot{display:flex;align-items:center;justify-content:center;width:25px;height:25px;border:1.5px solid var(--g40);border-radius:50%;background:#000;color:#000;transition:all .5s var(--back)}
.loop-n.done .loop-dot{background:#fff;border-color:#fff;box-shadow:0 0 22px rgba(255,255,255,.65)}
.loop-n.part .loop-dot{border-color:#fff;background:radial-gradient(circle,#fff 0 4px,#000 5px)}
.loop-n:hover .loop-dot{border-color:#fff;transform:scale(1.14)}
.loop-l{margin-top:5px;font-size:10.5px;font-weight:700;letter-spacing:.26em;text-transform:uppercase;color:var(--g70)}
.loop-n.done .loop-l{color:#fff}.loop-s{font-size:12px;color:var(--g40)}
.dash-hero{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px}
.hero{padding:24px 26px 14px;overflow:hidden}
.hero-top{display:flex;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-bottom:12px}
.hero-num{margin-top:8px;font-size:clamp(46px,5.4vw,84px);font-weight:800;letter-spacing:-.04em;line-height:1;color:#fff;text-shadow:0 0 44px rgba(255,255,255,.3)}
.hero-num.neg{color:var(--g70);text-shadow:none}
[data-color="on"] .hero-num{color:var(--pos);text-shadow:0 0 44px rgba(110,231,160,.3)}[data-color="on"] .hero-num.neg{color:var(--neg);text-shadow:none}
.hero-stats{display:flex;gap:30px;margin-left:auto;padding-bottom:6px;flex-wrap:wrap}
.stat-v{margin-top:6px;font-size:22px;font-weight:700;letter-spacing:-.01em;color:#fff}
.stat-s{margin-top:2px;font-size:11px;color:var(--g40)}
.side{display:flex;flex-direction:column;gap:18px;padding:24px 22px 14px}
.side-ring{display:flex;flex-direction:column;align-items:center;gap:16px}
.ring-num{font-size:44px;font-weight:800;letter-spacing:-.03em;line-height:1;color:#fff;margin-bottom:6px}
.wl{display:flex;gap:28px}.wl-i{display:flex;flex-direction:column;align-items:center;gap:2px}
.wl-n{font-size:18px;font-weight:700;color:#fff}.wl-n.dimn{color:var(--g55)}
.wl-l{font-size:9.5px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--g40)}
.side-list{border-top:1px solid var(--line);padding-top:6px}
.kv{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--g05)}.kv:last-child{border-bottom:0}
.kv-k{font-size:12.5px;color:var(--g55)}.kv-v{font-size:13.5px;font-weight:600;color:#fff}
.legend{display:flex;align-items:center;gap:8px;font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--g40)}
.lgd{display:inline-block;width:8px;height:12px;border-radius:2px;margin-left:10px}
.lgd.up{border:1.5px solid var(--pos)}.lgd.dn{background:var(--neg-fill)}.lgd.wk{width:1.5px;background:var(--g55)}
.dash-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;align-items:start}
.panel-b.tight{padding:10px 12px 14px}
.trow{display:flex;align-items:center;gap:10px;width:100%;padding:10px;border-radius:12px;text-align:left;transition:background .2s,transform .3s var(--out)}
.trow:hover{background:var(--g05);transform:translateX(3px)}
.trow-sym{font-size:14px;font-weight:700;letter-spacing:.01em;color:#fff;white-space:nowrap}
.trow-d{font-size:11.5px;color:var(--g40);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.trow-open{font-size:10px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--g40)}
.trow-note{font-size:11px;color:var(--g40)}
.count{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:22px;padding:0 7px;border:1px solid var(--line2);border-radius:999px;font-size:11px;font-weight:700;color:var(--g55)}
.count.hot{background:#fff;color:#000;border-color:#fff;box-shadow:0 0 16px rgba(255,255,255,.4)}
.more{padding:8px 10px;font-size:11.5px;color:var(--g40)}
.mcal-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.mcal-t{font-size:12px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:#fff}.mcal-net{font-size:12px}
.mcal-g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr)) 58px;gap:4px}
.mcal-w{padding-bottom:4px;font-size:9px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--g28);text-align:center}
.mcal-d{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;aspect-ratio:1/1;min-height:38px;border:1px solid var(--g05);border-radius:9px;transition:transform .25s var(--out),border-color .2s,box-shadow .2s}
.mcal-d.off{border-color:transparent}
.mcal-n{font-size:11px;color:var(--g40)}.mcal-p{font-size:8.5px;font-weight:700;color:var(--g80)}
.mcal-d.today{border-color:var(--g55)}
.mcal-d.has{border-color:var(--line2)}.mcal-d.has .mcal-n{color:#fff}
.mcal-d.has:hover{transform:scale(1.1);border-color:#fff;box-shadow:0 0 18px rgba(255,255,255,.25);z-index:2}
.mcal-d.pos{background:rgba(255,255,255,calc(var(--a)*.94));border-color:transparent}
.mcal-d.pos.hi .mcal-n,.mcal-d.pos.hi .mcal-p{color:#000}
.mcal-d.neg{border:1px dashed var(--g40);background:repeating-linear-gradient(135deg,rgba(255,255,255,calc(var(--a)*.3)) 0 1.5px,transparent 1.5px 6px)}
.mcal-d.neg .mcal-p{color:var(--g55)}
[data-color="on"] .mcal-d.pos{background:rgba(110,231,160,calc(var(--a)*.9))}
[data-color="on"] .mcal-d.neg{border:1px solid transparent;background:rgba(255,122,122,calc(var(--a)*.75))}
[data-color="on"] .mcal-d.neg .mcal-p{color:#fff}
.mcal-wk{display:flex;flex-direction:column;align-items:flex-end;justify-content:center;gap:1px;padding-right:2px;font-size:11px}
.mcal-wt{font-size:9.5px;color:var(--g28)}
.modal.day{width:min(520px,100%);padding:24px}
.day-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.day-t{margin-top:6px;font-size:24px;font-weight:700;letter-spacing:-.02em;color:#fff}
.day-s{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:20px 0 14px}

/* ═══════════ composer ═══════════ */

/* ═══════════ shared list rows ═══════════ */
.hrow{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:1px;width:100%;padding:9px 12px;border-radius:11px;text-align:left;transition:background .2s,transform .3s var(--out)}
.hrow:hover{background:var(--g05);transform:translateX(2px)}
.hrow.on{background:var(--g08)}
.hrow.on::before{content:'';position:absolute;left:0;top:10px;bottom:10px;width:2px;border-radius:2px;background:#fff;box-shadow:0 0 10px #fff}
.hrow-t{font-size:13px;font-weight:600;color:var(--g80)}.hrow.on .hrow-t{color:#fff}
.hrow-s{font-size:11px;color:var(--g40)}
.hrow-x{position:absolute;right:8px;top:50%;display:flex;padding:5px;margin-top:-11px;border-radius:6px;color:var(--g40);opacity:0;transition:opacity .15s}
.hrow:hover .hrow-x{opacity:1}.hrow-x:hover{color:#fff;background:var(--g12)}
.inp.area{height:auto;padding:12px 14px;line-height:1.65;resize:none;overflow:hidden}
.inp.bare{background:none;border-color:transparent;padding:0;min-height:0;border-radius:0;box-shadow:none!important}
.field-btn.mini-date{width:auto;height:32px;padding:0 10px;font-size:11.5px;border-radius:9px;gap:7px}
.ps-ic{display:flex;align-items:center;justify-content:center;width:38px;height:38px;border:1px solid var(--line2);border-radius:11px;color:var(--g70);flex-shrink:0;transition:all .3s}
.ps-t{font-size:16px;font-weight:700;letter-spacing:-.005em;color:#fff}

/* ═══════════ prep ═══════════ */
.prep-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.prep-f{width:230px}.prep-f .field-btn{height:36px;border-radius:999px;font-size:12.5px}
.prep-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-right:6px}
.ptab{display:inline-flex;align-items:center;height:36px;border:1px solid var(--line);border-radius:999px;color:var(--g55);transition:all .25s var(--out)}
.ptab:hover{border-color:var(--line2);color:#fff}
.ptab.on{background:#fff;color:#000;border-color:#fff;box-shadow:0 0 22px rgba(255,255,255,.22)}
.ptab-b{height:100%;padding:0 4px 0 14px;font-size:12px;font-weight:700;letter-spacing:.06em}
.ptab-x{display:flex;padding:5px;margin-right:6px;border-radius:50%;opacity:.45}.ptab-x:hover{opacity:1;background:rgba(128,128,128,.3)}
.prep-view{display:flex;align-items:center;gap:12px;padding:12px 16px;font-size:13px;color:var(--g80);border-style:dashed;border-color:var(--g40)}
.prep-cols{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:18px;align-items:start}
.prep-main{display:flex;flex-direction:column;gap:14px;min-width:0}
.prep-side{position:sticky;top:8px;display:flex;flex-direction:column;gap:14px;max-height:calc(100vh - 100px)}
.ps{overflow:hidden}
.ps-h{display:flex;align-items:center;gap:14px;width:100%;padding:18px 20px;text-align:left}
.ps-tt{flex:1;min-width:0}.ps-hint{margin-top:2px;font-size:12.5px;color:var(--g40)}
.ps-dot{width:8px;height:8px;border:1px solid var(--g40);border-radius:50%;transition:all .5s var(--back)}
.ps-dot.on{background:#fff;border-color:#fff;box-shadow:0 0 12px #fff}
.ps.filled .ps-ic{border-color:#fff;color:#fff;box-shadow:0 0 18px rgba(255,255,255,.18)}
.ps-chev{color:var(--g40);transition:transform .35s var(--out)}.ps.shut .ps-chev{transform:rotate(-90deg)}
.ps-b{padding:2px 20px 20px;animation:rise .4s var(--out) backwards}
.ps-two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px}
.ps-sand{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.ps-sub{display:flex;flex-direction:column;gap:10px;min-width:0}
.ps-dir{display:flex;align-items:center;gap:8px;color:var(--g70)}
.ll{display:flex;flex-direction:column;gap:6px}
.ll-r{display:flex;align-items:center;gap:10px;min-height:38px}
.ll-dash{width:8px;height:1px;background:var(--g40);flex-shrink:0}
.ll-lab{min-width:112px;font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--g55);flex-shrink:0}
.ll-i{flex:1;min-width:0;height:38px;padding:0 2px;background:none;border:0;border-bottom:1px solid var(--line);font-size:14px;color:#fff;transition:border-color .25s,box-shadow .25s}
.ll-i::placeholder{color:var(--g28)}
.ll-i:hover{border-bottom-color:var(--line2)}
.ll-i:focus{border-bottom-color:#fff;box-shadow:0 8px 14px -10px rgba(255,255,255,.55)}
.ll-g{display:flex;gap:3px;flex-shrink:0}
.ll-gb{min-width:26px;height:24px;padding:0 5px;border:1px solid var(--line);border-radius:6px;font-size:10px;font-weight:800;color:var(--g40);transition:all .2s}
.ll-gb:hover:not(:disabled){border-color:var(--line2);color:#fff}.ll-gb.on{background:#fff;color:#000;border-color:#fff}
.ll-x{display:flex;padding:5px;border-radius:6px;color:var(--g28);flex-shrink:0}.ll-x:hover{color:#fff;background:var(--g08)}
.ll-add{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;height:28px;margin-top:4px;padding:0 10px;border-radius:8px;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--g40);transition:all .2s}
.ll-add:hover{color:#fff;background:var(--g05)}
.prep-exp{display:flex;flex-direction:column;min-height:0}
.prep-exp .panel-b{display:flex;flex-direction:column;gap:12px;min-height:0}
.prep-pre{margin:0;max-height:38vh;overflow:auto;padding:14px;border:1px solid var(--line);border-radius:12px;background:#000;font:12px/1.6 ui-monospace,'Cascadia Code','SF Mono',Consolas,monospace;color:var(--g70);white-space:pre-wrap;word-break:break-word;user-select:text}
.prep-exp-f{display:flex;align-items:center;gap:10px}.prep-note{flex:1;font-size:11.5px;color:var(--g40)}
.prep-hist{display:flex;flex-direction:column;min-height:120px;overflow:hidden}
.prep-hist .panel-b{overflow-y:auto}

/* ═══════════ journal + review ═══════════ */
.page-in.jr-in{display:grid;grid-template-columns:236px minmax(0,1fr);gap:18px;align-items:start;max-width:1280px}
.side-list-p{position:sticky;top:8px;display:flex;flex-direction:column;max-height:calc(100vh - 100px);overflow:hidden}
.side-list-p .panel-h{padding:14px 14px 0 18px}
.side-list-p .panel-b{overflow-y:auto}
.jr-main{display:flex;flex-direction:column;gap:16px;min-width:0}
.jr-top{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.jr-goal,.jr-econ{padding:16px 18px}
.jr-ch{display:flex;align-items:center;gap:9px;margin-bottom:10px;color:var(--g55)}
.jr-goal-t{display:block;width:100%;text-align:left;font-size:17px;font-weight:600;line-height:1.4;color:#fff;border-radius:6px}
.jr-goal-t.ph{color:var(--g28);font-weight:500}.jr-goal-t:hover{text-shadow:0 0 18px rgba(255,255,255,.4)}
.jr-goal-i{width:100%;background:none;border:0;border-bottom:1px solid #fff;padding:0 0 4px;font-size:17px;font-weight:600;color:#fff}
.jr-econ .inp.bare{font-size:14px;color:var(--g80)}
.jr-compose{padding:16px 18px 18px}
.jr-secs{display:flex;flex-wrap:wrap;gap:7px}
.jsec{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 13px;border:1px solid var(--line);border-radius:999px;font-size:12px;font-weight:500;color:var(--g55);transition:all .25s var(--out)}
.jsec:hover{color:#fff;border-color:var(--line2)}
.jsec.on{background:#fff;color:#000;border-color:#fff;font-weight:600;box-shadow:0 0 22px rgba(255,255,255,.22)}
.jsec-n{display:inline-flex;align-items:center;justify-content:center;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--g12);font-size:10px;font-weight:700}
.jsec.on .jsec-n{background:#000;color:#fff}
.jr-hint{margin:14px 2px 10px;font-size:13.5px;color:var(--g70);animation:rise .45s var(--out) backwards}
.jr-box{border:1px solid var(--line);border-radius:14px;background:var(--g03);transition:border-color .25s,box-shadow .25s}
.jr-box:focus-within{border-color:#fff;box-shadow:0 0 0 4px rgba(255,255,255,.06),0 0 26px rgba(255,255,255,.08)}
.jr-ta{display:block;width:100%;min-height:88px;padding:14px 16px 6px;background:none;border:0;resize:vertical;font-size:15px;line-height:1.65;color:#fff}
.jr-box-f{display:flex;align-items:center;gap:10px;padding:8px 10px 10px 16px}
.jr-kb{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--g40)}
.jr-feed{display:flex;flex-direction:column;gap:14px}
.tl{display:flex;flex-direction:column}
.tl-i{display:grid;grid-template-columns:84px 22px minmax(0,1fr);gap:0 8px}
.tl-time{padding-top:15px;text-align:right;font-size:11.5px;font-weight:600;color:var(--g55);white-space:nowrap}
.tl-late{display:block;font-size:10px;font-weight:500;color:var(--g28)}
.tl-rail{position:relative;display:flex;justify-content:center}
.tl-rail::before{content:'';position:absolute;top:0;bottom:0;width:1px;background:var(--line)}
.tl-i:first-child .tl-rail::before{top:20px}.tl-i:last-child .tl-rail::before{bottom:calc(100% - 20px)}
.tl-dot{position:relative;width:9px;height:9px;margin-top:17px;border:1.5px solid #fff;border-radius:50%;background:#000;transition:all .3s}
.tl-i:first-child .tl-dot{background:#fff;box-shadow:0 0 12px #fff}
.tl-card{margin-bottom:10px;padding:12px 16px 14px;border:1px solid var(--line);border-radius:14px;background:var(--panel);transition:border-color .25s}
.tl-card:hover{border-color:var(--line2)}
.tl-h{display:flex;align-items:center;gap:8px;margin-bottom:6px;color:var(--g55)}
.tl-sec{font-size:9.5px;font-weight:700;letter-spacing:.22em;text-transform:uppercase}
.tl-x{display:flex;padding:5px;border-radius:7px;color:var(--g40);opacity:0;transition:opacity .15s}
.tl-card:hover .tl-x,.tl-x:focus-visible{opacity:1}.tl-x:hover{color:#fff;background:var(--g08)}
.tl-text{font-size:14.5px;line-height:1.65;color:var(--g90);white-space:pre-wrap;overflow-wrap:anywhere}
.rv-nav{display:flex;align-items:center;gap:10px;padding:12px 16px}
.rv-per{min-width:186px;padding:0 6px}.rv-per-t{font-size:17px;font-weight:700;letter-spacing:-.01em;color:#fff}.rv-per-s{font-size:10px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--g40)}
.rv-stats{display:flex;gap:22px;margin-right:8px}
.rv-st .lbl{font-size:9px}.rv-sv{display:block;margin-top:3px;font-size:15px;font-weight:700;color:#fff}.rv-sv.pnl.neg{color:var(--neg)}.rv-sv.pnl.pos{color:var(--pos)}.rv-sv.pnl.nil{color:var(--g40)}
.rv-secs{display:flex;flex-direction:column;gap:14px}
.rv-sec{padding:18px 20px 20px}
.rv-sh{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.rv-sb{display:flex;flex-direction:column;gap:18px}
.rv-goal{padding:12px 14px;border:1px dashed var(--line2);border-radius:12px}.rv-goal-t{margin-top:5px;font-size:15px;font-weight:600;color:#fff}
.rp{display:flex;flex-direction:column;gap:9px}
.rp-h{display:flex;align-items:baseline;gap:10px}
.rp-n{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;border:1px solid var(--line2);border-radius:6px;font-size:10px;font-weight:700;color:var(--g55);text-transform:uppercase;flex-shrink:0;transform:translateY(-1px)}
.rp.filled .rp-n{background:#fff;color:#000;border-color:#fff}
.rp-t{flex:1;font-size:14px;font-weight:500;line-height:1.5;color:var(--g80)}
.rp-ts{font-size:10.5px;color:var(--g40);white-space:nowrap}
.rv-trade{display:flex;flex-direction:column;gap:12px;padding:14px;border:1px solid var(--line);border-radius:14px}
.rv-th{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border-radius:8px}

/* ═══════════ analytics ═══════════ */
.an-tabs{display:flex}
.an-body{display:flex;flex-direction:column;gap:18px}
.an-hero{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px}
.hero-num.sm{font-size:clamp(38px,4vw,60px)}
.an-sub{margin-top:5px;font-size:12px;color:var(--g40)}
.an-tiles{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.tile.big{display:flex;flex-direction:column;justify-content:center;padding:16px 18px}
.tile.big .tile-v{font-size:26px;letter-spacing:-.02em}
.tile-s{margin-top:3px;font-size:11.5px;color:var(--g40)}
.an-2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
.an-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.an-ctl{display:flex;gap:28px;flex-wrap:wrap}
.tt.static tbody tr{cursor:default}.tt.static th:first-child,.tt.static td:first-child{padding-left:4px}.tt.static th:last-child,.tt.static td:last-child{padding-right:4px}
.row-n{display:inline-block;min-width:34px;margin-left:10px;font-size:10.5px;font-weight:500;color:var(--g40);text-align:right}
.an-dir{padding:18px 20px}
.an-dir-h{display:flex;align-items:center}
.an-dir-b{display:flex;align-items:center;gap:22px;margin-top:14px}
.an-dir-s{flex:1}.an-dir-wr{font-size:22px;font-weight:800;color:#fff;line-height:1.1}
.kv-v.pnl.neg{color:var(--neg)}.kv-v.pnl.pos{color:var(--pos)}.kv-v.pnl.nil{color:var(--g40)}

/* ═══════════ settings ═══════════ */
.page-in.set-in{max-width:1120px}
.set-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
.set-data{grid-row:span 2}
.set .panel-h{color:var(--g55)}
.set-b{display:flex;flex-direction:column;gap:14px}
.set-tog{justify-content:space-between;width:100%}
.set-tt{flex:1;min-width:0}.set-tl{font-size:14px;font-weight:600;color:#fff}.set-ts{font-size:12.5px;font-weight:400;line-height:1.55;color:var(--g55)}
.set-counts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.set-c{padding:12px;border:1px solid var(--line);border-radius:12px}.set-cv{font-size:22px;font-weight:800;letter-spacing:-.02em;color:#fff;line-height:1.2}.set-c .lbl{font-size:8.5px;letter-spacing:.18em}
.set-backup{display:flex;align-items:center;gap:14px;padding:14px 16px;border:1px solid var(--line);border-radius:14px}
.set-backup.due{border-color:#fff;box-shadow:0 0 30px rgba(255,255,255,.08)}
.set-row{display:flex;flex-wrap:wrap;gap:8px}
.set-paste{display:flex;flex-direction:column;gap:10px;padding:14px;border:1px dashed var(--line2);border-radius:14px}
.set-code{margin:0;padding:10px 12px;border-radius:9px;background:#000;border:1px solid var(--line);font:12px ui-monospace,Consolas,monospace;color:#fff;user-select:all}
.set-warn{display:flex;align-items:center;gap:14px;padding:16px 18px;border-color:#fff;color:#fff}

@media (max-width:1240px){.prep-cols{grid-template-columns:minmax(0,1fr)}.prep-side{position:static;max-height:none}.an-hero{grid-template-columns:minmax(0,1fr)}.rv-stats{display:none}}
@media (max-width:920px){.page-in.jr-in{grid-template-columns:minmax(0,1fr)}.side-list-p{position:static;max-height:200px;order:2}.jr-top,.ps-two,.ps-sand,.an-2,.an-3,.set-grid{grid-template-columns:minmax(0,1fr)}.an-tiles{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.tl-i{grid-template-columns:62px 18px minmax(0,1fr)}.ll-lab{min-width:84px}.rv-per{min-width:0;flex:1}}

/* ═══════════ small screens: keep everything inside the viewport ═══════════ */
.seg{max-width:100%;overflow-x:auto;scrollbar-width:none}.seg::-webkit-scrollbar{display:none}
.hud-l{overflow:hidden}.hud-title{overflow:hidden;text-overflow:ellipsis}
@media (max-width:820px){
  .loopdots{display:none}
  .hud .btn.solid{padding:0 14px}
  .dash-top .seg,.page-head .seg{width:100%}
  .page-head>.grow{display:none}
  .page-head{align-items:flex-start;gap:10px}
  .loop{padding:14px 12px 16px}
  .hero{padding:20px 16px 10px}.hero-num{font-size:40px}
  .panel-h{padding:16px 16px 0}.panel-b{padding:14px 16px 18px}
  .log-bar .searchbox{width:100%}
  .tgrid{grid-template-columns:minmax(0,1fr)}
  .prep-f{width:100%}.prep-bar .seg{width:auto}
  .rv-nav{flex-wrap:wrap}
  .jr-secs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}.jsec{flex-shrink:0}
  .cmp-h{padding:0 10px;gap:6px}.cmp-title{display:none}
  .modal.detail{height:calc(100vh - 16px)}.ov{padding:8px}.dt-body{padding:18px 16px 32px}.dt-bar{padding:10px 8px 10px 16px}
  .dlg{padding:22px}.set-counts{grid-template-columns:repeat(2,minmax(0,1fr))}
  .an-ctl{gap:14px}.mcal-g{grid-template-columns:repeat(7,minmax(0,1fr))}.mcal-w:last-child,.mcal-wk{display:none}
  .toasts{bottom:72px;width:calc(100% - 24px)}.toast{max-width:100%}
  .exc-track{margin-left:22px;margin-right:22px}
}
.set-row .btn{height:auto;min-height:36px;padding-top:9px;padding-bottom:9px;white-space:normal;text-align:center;line-height:1.35}
@media (max-width:820px){.dt-pnl{text-align:left}}
.set-grid{display:block;columns:2;column-gap:18px}
.set-grid>.panel{break-inside:avoid;margin-bottom:18px}
@media (max-width:920px){.set-grid{columns:1}}
/* ═══════════ phones and tablets ═══════════
   Loaded last so it wins. Three jobs:
   1. dvh instead of vh, so the bottom nav never sits behind the phone's browser bar.
   2. safe-area padding for the iPhone notch and home bar.
   3. finger-sized tap targets and 16px inputs (iPhone zooms in on anything smaller). */

@supports (height:100dvh){
  .app,.main{height:100dvh}
  .modal{max-height:calc(100dvh - 48px)}
  .modal.inst{height:min(640px,calc(100dvh - 48px))}
  .modal.detail{height:min(920px,calc(100dvh - 48px))}
  .modal.sheet{height:100dvh;max-height:100dvh}
  .modal.pal{max-height:min(560px,calc(100dvh - 22vh))}
  .lightbox img{max-height:calc(100dvh - 110px)}
}

html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
button,a,input,select,textarea,label{-webkit-tap-highlight-color:transparent;touch-action:manipulation}

@media (max-width:820px){
  .app{grid-template-rows:minmax(0,1fr) calc(60px + env(safe-area-inset-bottom))}
  .rail{padding:0 8px env(safe-area-inset-bottom)}
  .hud{padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
  .main{padding-top:env(safe-area-inset-top)}
  .modal.detail{height:calc(100dvh - 16px)}
  .wl-l,.mcal-w,.mcal-p,.lbl{font-size:10px}
  .toasts{bottom:calc(72px + env(safe-area-inset-bottom))}
}

/* Touch screens: no hover, fat fingers. */
@media (pointer:coarse){
  input,textarea,select,[contenteditable]{font-size:16px!important}
  .seg-b,.seg.sm .seg-b{height:36px;padding:0 14px}
  .ll-add,.jsec{min-height:38px}
  .tc-star{padding:11px}
  .pager-n{min-width:40px;height:40px}
  .log-bar .searchbox input{min-height:36px}
  .chip{height:38px}
  .ibtn{width:40px;height:40px}
  .ll-gb{min-width:36px;height:34px}
  .btn.sm{min-height:38px}
  .link{display:inline-flex;align-items:center;min-height:36px}
  .field-btn{min-height:40px}
  .rail-mark:hover{filter:none;transform:none}
}
